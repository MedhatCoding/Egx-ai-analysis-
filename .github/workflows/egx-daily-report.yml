name: EGX Daily Report

on:
  # اختبار حقيقي بعد تعديل إعدادات التقرير فقط.
  push:
    paths:
      - "config.yaml"
      - ".github/workflows/egx-daily-report.yml"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
      - "run_daily.py"
      - "data/universe.csv"
      - "data/egx33.txt"
      - "data/sharia_extra.csv"
      - "tests/**"

  # Retry every 10 minutes across the UTC hours that cover Cairo 09:00 and 11:00
  # in both UTC+2 (winter) and UTC+3 (summer). Python windows + state guards
  # make retries idempotent and prevent duplicate reports/reviews.
  schedule:
    - cron: "*/10 6-9 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Force a full run now"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Fetch and analyze data without sending Telegram or committing report output"
        required: false
        default: true
        type: boolean

concurrency:
  group: egx-daily-report-v2
  # Never cancel a run after it may have sent Telegram but before its state is committed.
  # Cancellation in that gap can cause the next scheduled retry to send a duplicate.
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || secrets.EODHD_API_TOKEN }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PORTFOLIO_ENCRYPTION_KEY: ${{ secrets.PORTFOLIO_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-job.txt

      - name: Run scheduled report or opening review
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # The UTC cron covers both Cairo UTC+2 and UTC+3 seasons.
            # Python applies the exact 08:50-09:20 and 10:50-11:20 local windows,
            # plus weekday/holiday and duplicate-send guards.
            CAIRO_HOUR="$(TZ=Africa/Cairo date +%H)"
            if [ "$CAIRO_HOUR" = "09" ]; then
              python run_daily.py
            elif [ "$CAIRO_HOUR" = "11" ]; then
              python run_daily.py --opening-review
            else
              echo "No scheduled task for Cairo local hour $CAIRO_HOUR; safely skipping."
            fi
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              python run_daily.py --force --dry-run
            else
              python run_daily.py --dry-run
            fi
          elif [ "${{ inputs.force }}" = "true" ]; then
            python run_daily.py --force
          else
            python run_daily.py
          fi

      - name: Commit generated data
        if: github.event_name != 'push' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "chore: update EGX daily report"
            git push
          fi

      - name: Publish updated report to PWA
        if: github.event_name != 'push' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: Run offline engine tests
        run: python tests/test_engine.py

      - name: Diagnose published report freshness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/signals/latest.json")
          if not p.exists():
              print("REPORT_STATUS=missing")
              raise SystemExit(0)
          try:
              report = json.loads(p.read_text(encoding="utf-8"))
              print(f"REPORT_DATA_DATE={report.get('data_date', 'unknown')}")
              print(f"REPORT_GENERATED_AT={report.get('generated_at', 'unknown')}")
              print(f"REPORT_ANALYZED={report.get('analyzed', 'unknown')}")
              print(f"REPORT_UNIVERSE={report.get('universe_size', 'unknown')}")
          except Exception as exc:
              print(f"REPORT_STATUS=invalid_json: {exc}")
          PY
