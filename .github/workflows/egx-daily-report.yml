name: EGX Daily Report

on:
  # اختبار حقيقي بعد تعديل إعدادات التقرير فقط.
  push:
    paths:
      - "config.yaml"
      - ".github/workflows/egx-daily-report.yml"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
      - "run_daily.py"

  # تشغيل تلقائي يوميًا في أيام التداول.
  # 06:00 UTC = 09:00 القاهرة صيفًا، و07:00 UTC = 09:00 القاهرة شتاءً.
  schedule:
    - cron: "0 6 * * 0-4"
    - cron: "5 6 * * 0-4"
    - cron: "0 7 * * 0-4"
    - cron: "5 7 * * 0-4"

  workflow_dispatch:
    inputs:
      force:
        description: "Force a full run now"
        required: false
        default: false
        type: boolean

concurrency:
  group: egx-daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || secrets.EODHD_API_TOKEN }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PORTFOLIO_ENCRYPTION_KEY: ${{ secrets.PORTFOLIO_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-job.txt

      - name: Run offline engine tests
        run: python tests/test_engine.py

      - name: Run daily report
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then
            python run_daily.py --force
          else
            python run_daily.py
          fi

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "chore: update EGX daily report"
            git push
          fi
