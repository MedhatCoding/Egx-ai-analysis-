name: Build gpt-Mi Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "app/assets/gpt-mi-logo.jpg"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare branded launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("app/assets/gpt-mi-logo.jpg").convert("RGBA")
          for folder,size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              p=Path("android/app/src/main/res/mipmap-"+folder)
              p.mkdir(parents=True,exist_ok=True)
              src.resize((size,size),Image.Resampling.LANCZOS).save(p/"ic_launcher.png")
          PY
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-Mi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
