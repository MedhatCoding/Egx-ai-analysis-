# =====================================================================
#  إعدادات محلل الأسهم المصرية
# =====================================================================

market:
  timezone: "Africa/Cairo"
  trading_weekdays: [6, 0, 1, 2, 3]
  report_window: ["08:55", "09:10"]
  session_close_hour: 15
universe:
  mode: "union"
data:
  history_years: 3
  yahoo_suffix: ".CA"
  benchmark_symbol: "^CASE30"
  min_bars: 150
  max_stale_days: 4
  eodhd_daily_budget: 15
  request_sleep: 0.3
filters:
  min_avg_value_egp: 1500000
  price_limit_pct: 10
regime:
  weights:
    bench_above_sma50: 0.25
    bench_above_sma200: 0.15
    bench_sma50_rising: 0.10
    breadth_above_sma50: 0.30
    breadth_above_sma200: 0.20
  strong_up: 0.80
  up: 0.60
  neutral: 0.40
  weak: 0.20
scoring:
  weights:
    trend: 30
    momentum: 25
    relative_strength: 20
    volume: 15
    setup: 10
  buy_score: 70
  watch_score: 55
  avoid_score: 35
  rsi_max_for_buy: 78
  extended_atr_mult: 4.0
  min_room_r: 1.0
risk:
  stop_min_atr: 1.2
  stop_max_atr: 3.0
  swing_lookback: 10
  target_r: [2.0, 3.0]
  risk_per_trade_pct: 1.0
  max_position_pct: 10.0
  max_buys_by_regime:
    strong_up: 5
    up: 4
    neutral: 2
    weak: 1
    down: 0
  regime_min_score: 0.20
  max_hold_days: 20
  round_trip_cost_pct: 0.5
backtest:
  refresh_every_days: 7
  baseline_every_n_bars: 5
llm:
  provider: "gemini"
  anthropic_model: "claude-haiku-4-5-20251001"
  gemini_model: "gemini-2.5-flash"
  max_tokens: 2000
  timeout: 90
telegram:
  enabled: true
  max_picks: 5
  max_watch: 5
# اختبار التشغيل التلقائي
